# Postgres local para desenvolvimento (porta 5433 para não conflitar com outros projetos).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: viveiro
      POSTGRES_PASSWORD: viveiro_dev
      POSTGRES_DB: viveiro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
